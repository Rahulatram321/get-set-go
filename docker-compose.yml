services:
  postgres:
    image: postgres:16-alpine
    container_name: orbitqueue-postgres
    environment:
      POSTGRES_USER: orbitqueue
      POSTGRES_PASSWORD: orbitqueue
      POSTGRES_DB: orbitqueue
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitqueue"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orbitqueue-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: orbitqueue-api
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://orbitqueue:orbitqueue@postgres:5432/orbitqueue
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-orbitqueue-dev-secret-change-in-production}
      API_PORT: 3001
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:3001
      LOG_LEVEL: info
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: orbitqueue-worker
    environment:
      DATABASE_URL: postgresql://orbitqueue:orbitqueue@postgres:5432/orbitqueue
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: 10
      LOG_LEVEL: info
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.scheduler
    container_name: orbitqueue-scheduler
    environment:
      DATABASE_URL: postgresql://orbitqueue:orbitqueue@postgres:5432/orbitqueue
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: orbitqueue-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
